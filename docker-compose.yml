services:
  postgres:
    image: postgres:16-alpine
    container_name: wsi-invest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wsi
      POSTGRES_PASSWORD: wsi
      POSTGRES_DB: wsi_invest
    ports:
      - "5433:5432"
    volumes:
      - wsi_invest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsi -d wsi_invest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wsi-invest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wsi_invest_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wsi_invest_pg:
  wsi_invest_redis:
